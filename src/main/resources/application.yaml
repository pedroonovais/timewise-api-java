spring:
  application:
    name: timewise
  
  # Habilita Docker Compose para iniciar containers automaticamente
  docker:
    compose:
      enabled: true
      file: compose.yaml
  
  # Configuração do banco de dados PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/timewise_db
    username: timewise_user
    password: timewise_password
    driver-class-name: org.postgresql.Driver
  
  # Configuração JPA/Hibernate
  jpa:
    hibernate:
      # update: cria/atualiza o schema conforme as entidades (recomendado para desenvolvimento)
      # create: recria o schema a cada inicialização (apaga dados existentes)
      # create-drop: cria ao iniciar e apaga ao encerrar (útil para testes)
      # validate: apenas valida o schema, não altera nada
      # none: desabilita a geração automática
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # Configuração de mensagens de validação (i18n)
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: true
  
  # Configuração RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: timewise_user
    password: timewise_password
    # Configuração de conexão com retry automático
    connection-timeout: 60000
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        multiplier: 2
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
        acknowledge-mode: auto
        prefetch: 10
        # Aguarda o RabbitMQ estar pronto antes de iniciar listeners
        auto-startup: true

# Configuração JWT
jwt:
  secret: timewise-secret-key-2024-very-secure-and-long-key-for-jwt-token-generation-minimum-256-bits
  expiration: 86400000 # 24 horas em milissegundos