spring:
  application:
    name: timewise
  
  # Habilita Docker Compose apenas em desenvolvimento local
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      file: compose.yaml
  
  # Configuração do banco de dados PostgreSQL
  # Usa variáveis de ambiente no Render, com valores padrão para desenvolvimento local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/timewise_db}
    username: ${SPRING_DATASOURCE_USERNAME:timewise_user}
    password: ${SPRING_DATASOURCE_PASSWORD:timewise_password}
    driver-class-name: org.postgresql.Driver
  
  # Configuração JPA/Hibernate
  jpa:
    hibernate:
      # update: cria/atualiza o schema conforme as entidades (recomendado para desenvolvimento)
      # create: recria o schema a cada inicialização (apaga dados existentes)
      # create-drop: cria ao iniciar e apaga ao encerrar (útil para testes)
      # validate: apenas valida o schema, não altera nada
      # none: desabilita a geração automática
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # Configuração de mensagens de validação (i18n)
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: true
  
  # Configuração RabbitMQ
  # Usa variáveis de ambiente no Render, com valores padrão para desenvolvimento local
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:timewise_user}
    password: ${SPRING_RABBITMQ_PASSWORD:timewise_password}
    # Configuração de conexão com retry automático
    connection-timeout: 60000
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        multiplier: 2
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
        acknowledge-mode: auto
        prefetch: 10
        # Aguarda o RabbitMQ estar pronto antes de iniciar listeners
        auto-startup: true

  # Configuração AI (Groq via Spring AI OpenAI)
  ai:
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: llama-3.1-8b-instant

# Configuração JWT
# Usa variável de ambiente no Render, com valor padrão para desenvolvimento local
jwt:
  secret: ${JWT_SECRET:timewise-secret-key-2024-very-secure-and-long-key-for-jwt-token-generation-minimum-256-bits}
  expiration: ${JWT_EXPIRATION:86400000} # 24 horas em milissegundos