version: '3.8'

services:
  # Serviço PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: timewise-postgres
    environment:
      # Credenciais do banco de dados
      POSTGRES_DB: timewise_db
      POSTGRES_USER: timewise_user
      POSTGRES_PASSWORD: timewise_password
    ports:
      # Porta 5432 do host mapeada para 5432 do container
      - "5432:5432"
    volumes:
      # Persistência dos dados do banco
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Verifica se o PostgreSQL está pronto para conexões
      test: ["CMD-SHELL", "pg_isready -U timewise_user -d timewise_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - timewise-network

  # Serviço RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: timewise-rabbitmq
    environment:
      # Credenciais do RabbitMQ
      RABBITMQ_DEFAULT_USER: timewise_user
      RABBITMQ_DEFAULT_PASS: timewise_password
    ports:
      # Porta 5672 do host mapeada para 5672 do container (AMQP)
      - "5672:5672"
      # Porta 15672 do host mapeada para 15672 do container (Management UI)
      - "15672:15672"
    volumes:
      # Persistência dos dados do RabbitMQ
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Verifica se o RabbitMQ está pronto para conexões
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - timewise-network

volumes:
  # Volume nomeado para persistir dados do PostgreSQL
  postgres_data:
  # Volume nomeado para persistir dados do RabbitMQ
  rabbitmq_data:

networks:
  # Rede isolada para comunicação entre containers
  timewise-network:
    driver: bridge

